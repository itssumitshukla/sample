<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splash Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <!-- Brand logo -->
      <img
        src="./img/habitual-branding.png"
        alt="Habitual Logo"
        class="brand-img"
      />
      <!-- Title and text -->
      <div class="text-container">
        <h1 class="title">Find the stuff you'll love.</h1>
        <p class="text">
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Praesentium
          debitis aliquid natus eveniet iusto, vero nisi neque, quidem, quaerat
          expedita dignissimos corporis!
        </p>
        <div class="app-store-btn">
          <a href="https://apple.com" target="_blank"
            ><img src="./img/app-store-button.png" alt="App Store"
          /></a>
        </div>
        <div class="google-play-btn">
          <a href="https://google.com" target="_blank"
            ><img src="./img/google-play-button.png" alt="Google Play Store"
          /></a>
        </div>
      </div>
      <!-- Main Image -->
      <div class="main-image-container">
        <img src="./img/main-image.png" alt="Landing Page Mockup" />
      </div>
      <!-- Images -->
      <img src="./img/profile.png" alt="profile" class="profile-img" />
      <img src="./img/orders.png" alt="orders" class="orders-img" />
      <img src="./img/home.png" alt="home" class="home-img" />
      <img src="./img/cart.png" alt="cart" class="cart-img" />
      <img src="./img/product.png" alt="product" class="product-img" />
    </div>
    <!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
